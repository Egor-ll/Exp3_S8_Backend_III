# ============================================
# BancoXYZ - Bank Backend
# ============================================

spring.application.name=bank-backend

server.port=8080

# ============================================
# PostgreSQL
# ============================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bancoxyz}
spring.datasource.username=${DB_USER:bancoxyz}
spring.datasource.password=${DB_PASSWORD:bancoxyz123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / Hibernate
# ============================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================
# Eureka Service Discovery
# ============================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================
# Instancia Eureka
# ============================================

eureka.instance.non-secure-port-enabled=true
eureka.instance.secure-port-enabled=false

eureka.instance.non-secure-port=${server.port}

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:bank-backend}

eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# ============================================
# Spring Boot Actuator
# ============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# Apache Kafka
# ============================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=bank-backend-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ============================================
# OAuth2 Resource Server
# ============================================

# Debe coincidir con el issuer que declara el auth-server en sus JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}

# En Docker, el JWK se obtiene directamente desde el contenedor auth-server.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}